name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build vm-lite
        run: bash scripts/build_baremetal.sh

      - name: Upload elf
        uses: actions/upload-artifact@v4
        with:
          name: vm-lite.elf
          path: out/vm-lite.elf
